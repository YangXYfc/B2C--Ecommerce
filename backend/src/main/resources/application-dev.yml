# ============================================================
# 本地开发环境 MySQL 连接配置
# 密码通过环境变量 DB_PASSWORD 提供，避免提交真实密码到仓库
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jd_ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
